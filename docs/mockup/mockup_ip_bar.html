<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Progress Bar — Mockup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; padding: 2rem; }

        .ip-track {
            position: relative;
            height: 28px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
        }
        /* Off-hours shade — covers areas outside work window */
        .ip-off-shade {
            position: absolute;
            top: 0; bottom: 0;
            background: rgba(0,0,0,0.10);
        }
        .ip-bar {
            position: absolute;
            top: 4px; bottom: 4px;
            background: #0d6efd;
            border-radius: 3px;
            opacity: 0.85;
            cursor: default;
            transition: opacity 0.15s;
        }
        .ip-bar:hover { opacity: 1; }
        .ip-tick {
            position: absolute;
            top: 0; bottom: 0;
            border-left: 1px solid rgba(0,0,0,0.12);
        }
        .ip-tick-labels {
            position: relative;
            height: 18px;
            margin-top: 4px;
        }
        .ip-tick-label {
            position: absolute;
            font-size: 0.65rem;
            color: #6c757d;
            transform: translateX(-50%);
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div class="container-fluid" style="max-width:900px">

    <!-- ── Week view ── -->
    <h6 class="text-muted mb-2">Week view</h6>
    <div class="card mb-4">
        <div class="card-header fw-semibold">
            <i class="bi bi-activity me-1"></i>In Progress
        </div>
        <div class="card-body py-3">
            <!--
                Range: Mon 16 00:00 → Fri 20 17:00 = 113h = 100%
                Day = 21.2%. Work band 08:00–18:00 per day:
                  off-before: 08/24 * 21.2% = 7.1%
                  work:       10/24 * 21.2% = 8.85%
                  off-after:  06/24 * 21.2% = 5.3%

                Off-shade segments (before and after work hours each day):
                Mon  : 0%–7.1%  and 15.95%–21.2%
                Tue  : 21.2%–28.3%  and 37.15%–42.5%
                Wed  : 42.5%–49.6%  and 58.45%–63.7%
                Thu  : 63.7%–70.8%  and 79.65%–84.9%
                Fri  : 84.9%–92.0%  and 98.9%–100%
            -->
            <div class="ip-track">
                <!-- Off-hour shades -->
                <div class="ip-off-shade" style="left:0%;width:7.1%"></div>
                <div class="ip-off-shade" style="left:15.95%;width:5.25%"></div>
                <div class="ip-off-shade" style="left:21.2%;width:7.1%"></div>
                <div class="ip-off-shade" style="left:37.15%;width:5.35%"></div>
                <div class="ip-off-shade" style="left:42.5%;width:7.1%"></div>
                <div class="ip-off-shade" style="left:58.45%;width:5.25%"></div>
                <div class="ip-off-shade" style="left:63.7%;width:7.1%"></div>
                <div class="ip-off-shade" style="left:79.65%;width:5.25%"></div>
                <div class="ip-off-shade" style="left:84.9%;width:7.1%"></div>
                <div class="ip-off-shade" style="left:98.9%;width:1.1%"></div>

                <!-- Day ticks -->
                <div class="ip-tick" style="left:21.2%"></div>
                <div class="ip-tick" style="left:42.5%"></div>
                <div class="ip-tick" style="left:63.7%"></div>
                <div class="ip-tick" style="left:84.9%"></div>

                <!-- IP bars -->
                <div class="ip-bar" style="left:8.0%;width:3.1%"
                     data-bs-toggle="tooltip" title="GITIN-1403: Despliegue 12.01.00&#10;GITIN-1281: Mejoras de Logging"></div>
                <div class="ip-bar" style="left:12.4%;width:3.1%"
                     data-bs-toggle="tooltip" title="GITIN-1281: Mejoras de Logging"></div>
                <div class="ip-bar" style="left:29.7%;width:2.2%"
                     data-bs-toggle="tooltip" title="GITIN-1354: Renovación de certificado WebSite"></div>
                <div class="ip-bar" style="left:50.9%;width:7.9%"
                     data-bs-toggle="tooltip" title="GITIN-1403: Despliegue 12.01.00&#10;GITIN-1397: Fix: Console Logs&#10;GITIN-1281: Mejoras de Logging"></div>
                <div class="ip-bar" style="left:72.2%;width:2.6%"
                     data-bs-toggle="tooltip" title="GITIN-1403: Despliegue 12.01.00"></div>
                <div class="ip-bar" style="left:75.7%;width:1.8%"
                     data-bs-toggle="tooltip" title="GITIN-1281: Mejoras de Logging"></div>
                <!-- Off-hours bar (sits inside the shade, still blue but over dark bg) -->
                <div class="ip-bar" style="left:83.2%;width:1.8%"
                     data-bs-toggle="tooltip" title="GITIN-1403: Despliegue 12.01.00"></div>
                <div class="ip-bar" style="left:92.0%;width:7.1%"
                     data-bs-toggle="tooltip" title="GITIN-1403: Despliegue 12.01.00&#10;GITIN-1281: Mejoras de Logging"></div>
            </div>

            <div class="ip-tick-labels">
                <span class="ip-tick-label" style="left:0%">Mon 16</span>
                <span class="ip-tick-label" style="left:21.2%">Tue 17</span>
                <span class="ip-tick-label" style="left:42.5%">Wed 18</span>
                <span class="ip-tick-label" style="left:63.7%">Thu 19</span>
                <span class="ip-tick-label" style="left:84.9%">Fri 20</span>
                <span class="ip-tick-label" style="left:100%">now</span>
            </div>
        </div>
    </div>

    <!-- ── Today view ── -->
    <h6 class="text-muted mb-2">Today view</h6>
    <div class="card mb-4">
        <div class="card-header fw-semibold">
            <i class="bi bi-activity me-1"></i>In Progress
        </div>
        <div class="card-body py-3">
            <!-- Range: 00:00–17:00 = 1020 min = 100% -->
            <!-- Work 08:00–17:00 (capped at now): left=47.1%, width=52.9% -->
            <!-- Off shade: 0%–47.1% (before work hours, no after since now < 18:00) -->
            <div class="ip-track">
                <div class="ip-off-shade" style="left:0%;width:47.1%"></div>

                <div class="ip-tick" style="left:11.8%"></div>
                <div class="ip-tick" style="left:23.5%"></div>
                <div class="ip-tick" style="left:35.3%"></div>
                <div class="ip-tick" style="left:47.1%"></div>
                <div class="ip-tick" style="left:58.8%"></div>
                <div class="ip-tick" style="left:70.6%"></div>
                <div class="ip-tick" style="left:82.4%"></div>
                <div class="ip-tick" style="left:94.1%"></div>

                <!-- 07:30–08:15 — starts in off-hours shade, crosses into work hours -->
                <!-- 07:30 = 450min → 44.1% | 08:15 = 495min → 48.5% | width = 4.4% -->
                <div class="ip-bar" style="left:44.1%;width:4.4%"
                     data-bs-toggle="tooltip" title="GITIN-1412: Fix urgente producción"></div>

                <div class="ip-bar" style="left:52.9%;width:7.1%"
                     data-bs-toggle="tooltip" title="GITIN-1403: Despliegue 12.01.00&#10;GITIN-1281: Mejoras de Logging"></div>
                <div class="ip-bar" style="left:64.7%;width:17.6%"
                     data-bs-toggle="tooltip" title="GITIN-1403: Despliegue 12.01.00&#10;GITIN-1397: Fix: Console Logs eliminados"></div>
                <div class="ip-bar" style="left:85.9%;width:8.2%"
                     data-bs-toggle="tooltip" title="GITIN-1281: Mejoras de Logging"></div>
            </div>

            <div class="ip-tick-labels">
                <span class="ip-tick-label" style="left:0%">00:00</span>
                <span class="ip-tick-label" style="left:11.8%">02:00</span>
                <span class="ip-tick-label" style="left:23.5%">04:00</span>
                <span class="ip-tick-label" style="left:35.3%">06:00</span>
                <span class="ip-tick-label" style="left:47.1%">08:00</span>
                <span class="ip-tick-label" style="left:58.8%">10:00</span>
                <span class="ip-tick-label" style="left:70.6%">12:00</span>
                <span class="ip-tick-label" style="left:82.4%">14:00</span>
                <span class="ip-tick-label" style="left:94.1%">16:00</span>
                <span class="ip-tick-label" style="left:100%">now</span>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el =>
        new bootstrap.Tooltip(el, { html: false })
);
</script>
</body>
</html>
