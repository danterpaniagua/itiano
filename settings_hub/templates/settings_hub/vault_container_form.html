{% extends "base.html" %}
{% block title %}Settings – Edit Container – Itiano{% endblock %}

{% block content %}
<div class="d-flex flex-wrap gap-2 align-items-center mb-3">
    <h5 class="mb-0 me-auto"><i class="bi bi-gear"></i> Settings</h5>
</div>

<div class="row">
    <div class="col-12 col-md-2 mb-3 mb-md-0">
        {% with active='app' %}{% include 'settings_hub/_sidebar.html' %}{% endwith %}
    </div>

    <div class="col-12 col-md-6">
        <h6 class="mb-3">Edit Container</h6>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" name="name" class="form-control"
                       value="{{ container.name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Parent</label>
                <select name="parent_id" class="form-select">
                    <option value="">— None (root) —</option>
                    {% for c in other_containers %}
                    <option value="{{ c.pk }}" {% if container.parent_id == c.pk %}selected{% endif %}>{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="{% url 'settings-vault' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
