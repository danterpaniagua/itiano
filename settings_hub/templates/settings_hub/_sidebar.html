<div class="list-group">
    <a href="{% url 'settings-user' %}"
       class="list-group-item list-group-item-action{% if active == 'user' %} active{% endif %}">
        <i class="bi bi-person-gear me-1"></i> User Settings
    </a>
    {% if request.user.is_staff %}
    <a href="{% url 'settings-app' %}"
       class="list-group-item list-group-item-action{% if active == 'app' %} active{% endif %}">
        <i class="bi bi-gear me-1"></i> App Settings
    </a>
    {% endif %}
</div>
