services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./media:/app/media
      - ./certs:/app/certs
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, ssl, urllib.request; scheme = 'https' if os.path.exists('/app/certs/dev-cert.crt') else 'http'; urllib.request.urlopen(f'{scheme}://localhost:8000/health/', context=ssl._create_unverified_context())"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 40s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-itiano}
      POSTGRES_USER: ${DB_USER:-itiano}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-itiano}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
