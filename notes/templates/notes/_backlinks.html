{% if notes %}
<div class="card mt-3">
    <a class="card-header small text-decoration-none text-body d-flex align-items-center gap-2" data-bs-toggle="collapse" href="#backlinks-{{ uid }}" role="button" aria-expanded="false">
        <i class="bi bi-chevron-right"></i> <i class="bi bi-journal-text"></i> Notes mentioning this <span class="badge bg-secondary">{{ notes|length }}</span>
    </a>
    <div class="collapse" id="backlinks-{{ uid }}">
        <div class="list-group list-group-flush">
            {% for note in notes %}
            <a href="{% url 'note-edit' note.pk %}" class="list-group-item list-group-item-action small d-flex flex-wrap gap-2">
                <span class="text-break">{{ note.title }}</span>
                {% if note.owner_id != viewer.pk %}<span class="text-muted ms-auto">by {{ note.owner.username }}</span>{% endif %}
            </a>
            {% endfor %}
        </div>
    </div>
</div>
{% endif %}
