{% extends "base.html" %}
{% block title %}Edit #{{ ticket.pk }} – Itiano{% endblock %}

{% block content %}
<div class="d-flex flex-wrap gap-2 align-items-center mb-3">
    <h5 class="mb-0 me-auto">Edit Ticket <span class="text-muted">#{{ ticket.pk }}</span></h5>
    <a href="{% url 'ticket-detail' ticket.pk %}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Cancel
    </a>
</div>

<div class="row">
    <div class="col-12 col-md-8 col-lg-6">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="text-danger small mt-1">{{ field.errors|join:", " }}</div>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
